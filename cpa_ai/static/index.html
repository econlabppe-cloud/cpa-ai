<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232457e6%27/%3E%3Cpath d=%27M9 17l5 5 9-11%27 stroke=%27white%27 stroke-width=%273.5%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<title>CPA-AI — הנהלת חשבונות בלי כאב ראש</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#162033;--mut:#5b6678;--line:#e1e6ef;--pri:#2457e6;--pri-ink:#fff;--ok:#12764a;--ok-bg:#dcf6e8;--warn:#92580a;--warn-bg:#fdf0cf;--err:#b3261e;--err-bg:#fde3e1;--info-bg:#e6efff;--r:14px;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1420;--card:#171f2f;--ink:#e8edf6;--mut:#9aa6bb;--line:#27324a;--pri:#6c93ff;--pri-ink:#0b1220;--ok:#5fd39b;--ok-bg:#12372a;--warn:#f0b95a;--warn-bg:#3a2d10;--err:#ff8a80;--err-bg:#40181a;--info-bg:#1a2a4d;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px;border-radius:6px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.hd{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:18px;color:var(--pri);letter-spacing:.2px}
.hd select{flex:1;min-width:0;max-width:280px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h2{font-size:22px;margin:4px 0 12px}h3{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
label{display:block;font-size:13px;color:var(--mut)}
input,select,textarea{width:100%;padding:11px 12px;min-height:44px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-top:4px;background:var(--bg);color:var(--ink)}
textarea{min-height:130px}
button{font:inherit;cursor:pointer;min-height:44px;border-radius:10px;padding:8px 16px;border:1px solid transparent}
button.act{background:var(--pri);color:var(--pri-ink);font-weight:600}
button.sec{background:transparent;color:var(--pri);border-color:var(--pri)}
button.ghost{background:transparent;color:var(--mut);border-color:var(--line)}
button.sm{min-height:36px;padding:4px 12px;font-size:14px}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:150px}.row>button{flex:0 0 auto}
.muted{color:var(--mut);font-size:13px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--info-bg);color:var(--pri)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.err{background:var(--err-bg);color:var(--err)}
.hello{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.clear{background:var(--ok-bg);color:var(--ok);border-radius:var(--r);padding:16px;font-weight:700;font-size:17px;margin-bottom:12px}
.task{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--pri);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.task.p1{border-inline-start-color:var(--err)}.task.p2{border-inline-start-color:#e08a00}.task.p3{border-inline-start-color:var(--pri)}.task.p4{border-inline-start-color:var(--line)}
.task b{display:block}.task .t-act{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center}
.kpi b{display:block;font-size:20px}.kpi span{font-size:12px;color:var(--mut)}.kpi small{display:block;font-size:11px;margin-top:2px}
.drop{display:block;border:2px dashed var(--line);border-radius:var(--r);padding:26px 14px;text-align:center;cursor:pointer;background:var(--card);margin-bottom:12px;transition:.15s}
.drop.over,.drop:hover{border-color:var(--pri);background:var(--info-bg)}
.drop big{display:block;font-size:34px}.drop strong{display:block;font-size:17px;margin:4px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--ink);min-height:38px;padding:4px 14px;border-radius:99px}
.chip[aria-pressed=true]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.doc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.d-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.d-top b{font-size:16px}.amt{font-weight:800;font-size:18px;white-space:nowrap}
.d-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 8px;font-size:13px;color:var(--mut)}
.f{font-size:13px;margin:3px 0}.f.error{color:var(--err)}.f.warning{color:var(--warn)}.f.info{color:var(--mut)}
.d-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
details{margin:6px 0}summary{cursor:pointer;color:var(--pri);font-size:14px;min-height:32px}
pre{background:#0f172a;color:#e2e8f0;padding:12px;border-radius:10px;overflow:auto;font-size:12px;direction:ltr;text-align:left}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.copy{display:flex;gap:8px;align-items:center}.copy code{flex:1;overflow:auto;padding:10px;background:var(--bg);border-radius:10px;direction:ltr;text-align:left;font-size:13px;white-space:nowrap}
nav{position:fixed;inset-inline:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:transparent;color:var(--mut);border-radius:0;min-height:60px;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;font-size:12px;position:relative}
nav button .ic{font-size:21px;line-height:1}
nav button[aria-current=page]{color:var(--pri);font-weight:700}
nav .dot{position:absolute;top:8px;inset-inline-start:calc(50% + 8px);background:var(--err);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px}
@media(min-width:900px){nav{position:sticky;top:57px;bottom:auto;inset-inline:auto;border:0;border-bottom:1px solid var(--line);max-width:980px;margin:0 auto;border-radius:0;background:transparent}nav button{flex-direction:row;gap:8px;min-height:48px;font-size:15px}nav .dot{position:static}body{padding-bottom:24px}}
dialog{border:0;border-radius:var(--r);padding:0;width:min(560px,94vw);box-shadow:0 10px 40px rgba(0,0,0,.35);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(8,12,22,.55)}
.dlg-hd{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}
.dlg-bd{padding:14px 16px;display:grid;gap:10px;max-height:62vh;overflow:auto}
.dlg-err{color:var(--err);font-size:13px;padding:0 16px;min-height:1.4em}
.dlg-ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
#msg{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));inset-inline:16px;max-width:560px;margin:auto;padding:12px 16px;border-radius:12px;display:none;z-index:20;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25)}
@media(min-width:900px){#msg{bottom:24px}}
.hide{display:none!important}
.skeleton{height:64px;border-radius:var(--r);background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.skeleton{animation:none}.drop{transition:none}}
</style>
</head>
<body>
<header><div class="hd">
  <span class="logo">CPA-AI</span>
  <select id="biz" aria-label="בחירת עסק"></select>
  <button class="ghost sm" id="btn-settings" aria-label="הגדרות משתמש">⚙️</button>
</div></header>

<nav id="nav" aria-label="ניווט ראשי"></nav>
<main class="wrap">
  <section id="v-home"></section>
  <section id="v-docs" class="hide"></section>
  <section id="v-bank" class="hide"></section>
  <section id="v-reports" class="hide"></section>
  <section id="v-more" class="hide"></section>
</main>

<dialog id="dlg" aria-labelledby="dlg-title"><form method="dialog" id="dlg-form">
  <div class="dlg-hd" id="dlg-title"></div>
  <div class="dlg-bd" id="dlg-body"></div>
  <div class="dlg-err" id="dlg-err" role="alert"></div>
  <div class="dlg-ft"><button class="act" id="dlg-ok" type="submit">שמירה</button><button class="ghost" type="button" id="dlg-cancel">ביטול</button></div>
</form></dialog>
<div id="msg" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ───────── כלים ───────── */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>n==null?"—":"₪"+Math.round(Number(n)).toLocaleString("he-IL");
const money2=n=>n==null?"—":Number(n).toLocaleString("he-IL",{minimumFractionDigits:2,maximumFractionDigits:2})+" ₪";
const dstr=iso=>iso?iso.split("-").reverse().join("/"):"—";
function store(k,v){try{if(v!==undefined)localStorage.setItem(k,v);return localStorage.getItem(k)}catch(e){return null}}
const S={biz:null,list:[],view:"home",filter:"pending_review",home:null,me:{is_admin:true,can_sign:true,role:"admin"}};
const CATS={office_supplies:"ציוד משרדי",software:"תוכנה",inventory:"מלאי",professional_services:"שירותים מקצועיים",vehicle:"רכב",refreshments:"כיבוד",hospitality:"אירוח",equipment:"ציוד / רכוש קבוע"};
const SRC={manual:["✍️","הוזן ידנית"],api:["✍️","הוזן ידנית"],upload:["📤","הועלה"],email:["📧","הגיע במייל"],whatsapp:["💬","הגיע בוואטסאפ"]};
const STATUS={confirmed:["ok","מאושר"],pending_review:["warn","מחכה לבדיקה"],rejected:["err","נדחה"],prepared:["warn","מוכן לאישור"],approved:["ok","אושר"],superseded:["err","מיושן"]};

function toast(text,ok){const m=$("msg");m.textContent=text;m.style.display="block";m.style.background=ok?"var(--ok-bg)":"var(--err-bg)";m.style.color=ok?"var(--ok)":"var(--err)";clearTimeout(m._t);m._t=setTimeout(()=>m.style.display="none",5200)}
async function api(path,opt={}){
  const h={"X-API-Key":store("cpa_key")||"","X-Actor":encodeURIComponent(store("cpa_actor")||"משתמש")};
  if(opt.json){h["Content-Type"]="application/json";opt.body=JSON.stringify(opt.json)}
  const r=await fetch(path,{...opt,headers:{...h,...(opt.headers||{})}});
  if(opt.raw){if(!r.ok)throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail);return r}
  const d=r.status===204?null:await r.json().catch(()=>null);
  if(!r.ok){const det=d&&d.detail;throw new Error(r.status===401?"חסר מפתח API — פתחו את ההגדרות (⚙️)":typeof det==="string"?det:JSON.stringify(det||r.statusText))}
  return d;
}
function saveBlob(b,name){const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function skeleton(n=3){return Array.from({length:n},()=>'<div class="skeleton"></div>').join("")}
const bid=()=>S.biz&&S.biz.id;

/* ───────── חלון טופס אחד לכל הפעולות ───────── */
function openForm(title,fields,onSubmit,okLabel="שמירה"){
  const dlg=$("dlg"),form=$("dlg-form"),body=$("dlg-body");
  $("dlg-title").textContent=title;$("dlg-ok").textContent=okLabel;$("dlg-err").textContent="";
  body.innerHTML=fields.map(f=>{const id="f-"+f.name;
    if(f.type==="checkbox")return `<label style="display:flex;gap:10px;align-items:flex-start;color:var(--ink)"><input type="checkbox" id="${id}" style="width:auto;min-height:0;margin-top:4px" ${f.value?"checked":""}> <span>${esc(f.label)}</span></label>`;
    if(f.type==="select")return `<label>${esc(f.label)}<select id="${id}">${f.options.map(([v,l])=>`<option value="${esc(v)}" ${v===f.value?"selected":""}>${esc(l)}</option>`).join("")}</select></label>`;
    if(f.type==="note")return `<p class="muted">${esc(f.label)}</p>`;
    return `<label>${esc(f.label)}<input id="${id}" type="${f.type||"text"}" value="${esc(f.value??"")}" ${f.required?"required":""} ${f.step?`step="${f.step}"`:""} ${f.type==="password"?'autocomplete="off"':""}></label>`}).join("");
  $("dlg-cancel").onclick=()=>dlg.close();
  form.onsubmit=async e=>{e.preventDefault();const out={};
    for(const f of fields){if(f.type==="note")continue;const el=$("f-"+f.name);out[f.name]=f.type==="checkbox"?el.checked:f.type==="number"?(el.value===""?null:+el.value):el.value.trim()}
    const btn=$("dlg-ok");btn.disabled=true;
    try{await onSubmit(out);dlg.close()}catch(err){$("dlg-err").textContent=err.message}finally{btn.disabled=false}};
  dlg.showModal();const first=body.querySelector("input:not([type=checkbox]),select");if(first)first.focus();
}

/* ───────── ניווט ───────── */
const NAV=[["home","🏠","בית"],["docs","🧾","מסמכים"],["bank","🏦","בנק"],["reports","📑","דוחות"],["more","⋯","עוד"]];
function drawNav(){$("nav").innerHTML=NAV.map(([k,ic,l])=>{const dot=k==="docs"&&S.home&&S.home.counts.pending?`<span class="dot" aria-label="${S.home.counts.pending} ממתינים">${S.home.counts.pending}</span>`:"";
  return `<button data-v="${k}" ${S.view===k?'aria-current="page"':""}><span class="ic" aria-hidden="true">${ic}</span>${l}${dot}</button>`}).join("");
  $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.v))}
function go(view,anchor){S.view=view;if(anchor==="m-advisor")S.openAdvisor=true;for(const [k] of NAV)$("v-"+k).classList.toggle("hide",k!==view);drawNav();render(view).then(()=>{if(anchor){const el=$(anchor);el&&el.scrollIntoView({behavior:"smooth",block:"center"})}else window.scrollTo(0,0)})}
async function render(view){try{await({home:renderHome,docs:renderDocs,bank:renderBank,reports:renderReports,more:renderMore})[view]()}catch(e){$("v-"+view).innerHTML=`<div class="card"><b>משהו השתבש</b><p class="muted">${esc(e.message)}</p></div>`}}

/* ───────── עסקים ───────── */
async function loadBiz(){
  try{S.me=await api("/api/v1/me")}catch(e){S.me={is_admin:false,can_sign:false,role:"client"}}
  try{S.list=await api("/api/v1/businesses")}catch(e){S.list=[];toast(e.message)}
  const want=+store("cpa_biz")||0;S.biz=S.list.find(b=>b.id===want)||S.list[0]||null;
  $("biz").innerHTML=S.list.map(b=>`<option value="${b.id}" ${S.biz&&S.biz.id===b.id?"selected":""}>${esc(b.name)}</option>`).join("")+(S.me.is_admin?'<option value="new">+ עסק חדש</option>':"");
  $("biz").classList.toggle("hide",!S.list.length);
}
$("biz").onchange=e=>{if(e.target.value==="new"){S.biz=null;go("home");return}store("cpa_biz",e.target.value);loadBiz().then(()=>go(S.view))};
function onboarding(){return `<div class="card"><h2>ברוכים הבאים 👋</h2><p class="muted">שלוש שאלות והמערכת מתחילה לעבוד: אתם שולחים חשבוניות (במייל, בוואטסאפ או בגרירה), היא מסדרת ומכינה את הדוחות, ורואה החשבון רק מאשר.</p>
 <div class="row"><label>שם העסק<input id="b-name" autocomplete="organization"></label><label>מספר עוסק מורשה<input id="b-vat" inputmode="numeric" autocomplete="off"></label><label>השם שלכם<input id="b-owner" autocomplete="name"></label></div>
 <div class="row" style="margin-top:10px"><label>תדירות דיווח מע"מ<select id="b-freq"><option value="bimonthly">אחת לחודשיים</option><option value="monthly">כל חודש</option></select></label><label>שיעור מקדמות (%) — אם יש<input id="b-adv" type="number" step="0.1" value="0"></label></div>
 <label style="display:flex;gap:10px;align-items:flex-start;color:var(--ink);margin:12px 0"><input id="b-consent" type="checkbox" style="width:auto;min-height:0;margin-top:5px"><span>מסכים/ה שתמונות וקבצים יועברו לשירות AI חיצוני לצורך קריאתם (לא חובה — בלי זה הקריאה נעשית מקומית)</span></label>
 <button class="act" id="b-create">התחלה</button></div>`}
async function createBiz(){const v=k=>$(k).value.trim();
  try{const b=await api("/api/v1/businesses",{method:"POST",json:{name:v("b-name"),vat_id:v("b-vat"),owner_name:v("b-owner"),vat_frequency:$("b-freq").value,advance_rate_percent:+$("b-adv").value||0,llm_consent:$("b-consent").checked}});
    store("cpa_biz",b.id);await loadBiz();toast("מעולה, העסק נוצר",true);go("home")}catch(e){toast(e.message)}}

/* ───────── בית ───────── */
async function renderHome(){
  const el=$("v-home");
  if(!S.biz){el.innerHTML=onboarding();$("b-create").onclick=createBiz;return}
  el.innerHTML=skeleton(4);
  const [h,conn]=await Promise.all([api(`/api/v1/businesses/${bid()}/home`),api(`/api/v1/businesses/${bid()}/connections`)]);
  S.home=h;drawNav();
  const bulk=h.counts.bulk_ready;
  const tasks=h.tasks.map(t=>{const cta=`<button class="${t.priority<=2?"act":"sec"} sm" data-go="${esc(t.cta.view)}" data-anchor="${esc(t.cta.anchor||'')}">${esc(t.cta.label)}</button>`;
    const bulkBtn=t.id==="review"&&bulk?`<button class="act sm" data-bulk="1">✓ אשרו ${bulk} בלחיצה</button>`:"";
    return `<div class="task p${t.priority}"><div><b>${esc(t.title)}</b><span class="muted">${esc(t.detail)}</span></div><div class="t-act">${bulkBtn}${cta}</div></div>`}).join("");
  const prev=h.deadlines[0],d=h.deadlines.find(x=>x.status!=="submitted")||h.deadlines[h.deadlines.length-1];const when=d.days_left<0?`באיחור של ${-d.days_left} ימים`:d.days_left===0?"היום":`עוד ${d.days_left} ימים`;
  const dl=d.period_open?"התקופה עוד פתוחה":d.status==="submitted"?"הוגש ✓":d.status==="approved"?"אושר, נשאר להגיש":d.status==="prepared"?"מוכן, מחכה לאישור":"עוד לא הוכן";
  const dlCls=d.period_open?"":d.status==="submitted"?"ok":d.days_left<0?"err":"warn";
  el.innerHTML=`
  <div class="hello"><h2>${esc(S.biz.name)}</h2><span class="muted">${dstr(h.today)}</span></div>
  ${h.all_clear?'<div class="clear">✅ הכל בסדר — אין משהו שדורש אותך כרגע</div>':'<h3>מה צריך ממך עכשיו</h3>'}
  ${tasks}
  <div class="kpis"><div class="kpi"><b>${money(h.month.income)}</b><span>הכנסות החודש</span><small class="muted">מתחילת השנה ${money(h.year.income)}</small></div><div class="kpi"><b>${money(h.month.expenses)}</b><span>הוצאות מוכרות</span><small class="muted">מתחילת השנה ${money(h.year.expenses)}</small></div><div class="kpi"><b>${money(h.month.profit)}</b><span>רווח החודש</span><small class="muted">מתחילת השנה ${money(h.year.profit)}</small></div></div>
  <div class="card"><h3 style="margin-bottom:4px">דוח מע"מ — ${esc(d.period_label)}</h3><span class="pill ${dlCls}">${dl}</span><p class="muted" style="margin:8px 0 0">להגשה עד <b>${dstr(d.due)}</b> · ${when}${prev.status==="submitted"&&d!==prev?` · ${esc(prev.period_label)} הוגש${prev.submission_ref?` (אישור ${esc(prev.submission_ref)})`:""} ✓`:""}</p>

  $("rules").innerHTML=`<p>מע"מ: ${r.vat_rates.map(x=>`${dstr(x.from)}: ${Math.round(x.rate*100)}%`).join(" · ")} ${v(r.vat_source)}</p><p>סף מספר הקצאה: ${r.allocation_thresholds.filter(x=>x.threshold).map(x=>`${dstr(x.from)}: ${x.threshold.toLocaleString("he-IL")} ₪`).join(" · ")} ${v(r.allocation_source)}</p>`+

async function loadAudit(){const l=await api("/api/v1/audit?limit=100");$("audit").innerHTML=l.map(a=>`<div class="f info">${new Date(a.ts).toLocaleString("he-IL")} · ${esc(a.actor)} · ${esc(a.action)} · ${esc(a.entity)}${a.entity_id!=null?" #"+a.entity_id:""}</div>`).join("")}

/* ───────── הגדרות משתמש ───────── */
function openSettings(note){openForm("הגדרות",[...(note?[{name:"n",type:"note",label:note}]:[]),
  {name:"actor",label:"השם שלכם (מופיע ביומן הפעולות)",value:store("cpa_actor")||""},
  {name:"key",label:"מפתח API (אם השרת דורש)",type:"password",value:store("cpa_key")||""}],
  async v=>{store("cpa_actor",v.actor);store("cpa_key",v.key);await loadBiz();go(S.view)})}
$("btn-settings").onclick=()=>openSettings();

(async()=>{drawNav();await loadBiz();go("home")})();
